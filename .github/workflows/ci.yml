name: CI

on:
  push:
    branches:
      - main
      - master
      - harpertoken
  pull_request:
    branches:
      - main
      - master
      - harpertoken

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black mypy

    - name: Lint with flake8
      run: |
        flake8 scripts/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 scripts/ --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics

    - name: Check formatting with black
      run: |
        black --check --diff scripts/

    - name: Type check with mypy
      run: |
        mypy scripts/ || true  # Allow mypy to fail for now

  ci-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Test Python syntax
      run: |
        python -m py_compile scripts/*.py

    - name: Run tests
      run: |
        PYTHONPATH=. pytest tests/ -v

    - name: Test imports
      run: |
        python -c "from scripts.data_prep import load_and_preprocess_data; print('Import ok')"
        python -c "import scripts.train; print('Train import ok')"
        python -c "import scripts.evaluate; print('Evaluate import ok')"

    - name: Train model
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        export FT_EPOCHS=1
        export FT_BATCH_SIZE=1
        export FT_LR=2e-5
        python scripts/train.py

  build-and-push:
    runs-on: ubuntu-latest
    needs: [lint, ci-test]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          ${{ secrets.DOCKERHUB_USERNAME }}/harpertoken-convai-finetune
          ghcr.io/${{ github.repository }}/harpertoken-convai-finetune
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max